<!-- Dark theme. Same shapes; brighter red and an inverted badge so both read on a dark background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 0 1200 1200" width="1200" height="1200">
  <defs>
    <mask id="gap">
      <rect x="120" width="1200" height="1200" fill="white"/>
      <circle cx="912" cy="600" r="252" fill="black"/>
    </mask>
  </defs>
  <!-- Bookmark body -->
  <path d="M312,168 A96,96 0 0 1 408,72 H792 A96,96 0 0 1 888,168 V1128 L600,960 L312,1128 Z"
        fill="#D13438" stroke="#D13438" stroke-width="48"
        stroke-linejoin="round" mask="url(#gap)"/>
  <!-- Circle -->
  <circle cx="912" cy="600" r="240" fill="#F3F3F3"/>
  <!-- Plus -->
  <g stroke="#212121" stroke-width="48" stroke-linecap="round" fill="none">
    <line x1="912" y1="482" x2="912" y2="718"/>
    <line x1="794" y1="600" x2="1030" y2="600"/>
  </g>
</svg>
